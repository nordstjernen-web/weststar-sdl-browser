name: windows

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: msys2/ucrt64 on windows-${{ matrix.windows }}
    runs-on: windows-${{ matrix.windows }}
    timeout-minutes: 60
    env:
      # The runner's user is an administrator. Without this the browser
      # relaunches itself unelevated or, failing that, asks in a message
      # box nobody can answer, and the job hangs.
      NS_ALLOW_ROOT: '1'

    strategy:
      fail-fast: false
      matrix:
        windows: ['2025']

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSYS2 (ucrt64)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: UCRT64
          # No full system upgrade (pacman -Syuu) on every run: it took most
          # of the job in Northstar. If the package databases go stale and
          # installs 404, set this back to true.
          update: false
          cache: true
          install: >-
            git
            diffutils
            mingw-w64-ucrt-x86_64-binutils
            mingw-w64-ucrt-x86_64-clang
            mingw-w64-ucrt-x86_64-lld
            mingw-w64-ucrt-x86_64-llvm-tools
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-meson
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-ccache
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-glib2
            mingw-w64-ucrt-x86_64-harfbuzz
            mingw-w64-ucrt-x86_64-fribidi
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-curl
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-ca-certificates
            mingw-w64-ucrt-x86_64-libpsl
            mingw-w64-ucrt-x86_64-sqlite3
            mingw-w64-ucrt-x86_64-zlib
            mingw-w64-ucrt-x86_64-brotli
            mingw-w64-ucrt-x86_64-zstd
            mingw-w64-ucrt-x86_64-libavif
            mingw-w64-ucrt-x86_64-opusfile
            mingw-w64-ucrt-x86_64-libvorbis

      - name: Restore ccache
        id: ccache-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}\ccache
            ${{ runner.temp }}\thinlto-cache
          key: ccache-windows-${{ matrix.windows }}-ucrt64-${{ github.sha }}
          restore-keys: |
            ccache-windows-${{ matrix.windows }}-ucrt64-

      - name: Configure ccache
        run: |
          export CCACHE_DIR="$RUNNER_TEMP/ccache"
          echo "CCACHE_DIR=$CCACHE_DIR" >> "$GITHUB_ENV"
          ccache --max-size=500M
          ccache --zero-stats

      - name: Show toolchain versions
        run: |
          clang --version
          ld.lld --version
          meson --version
          ninja --version
          pkg-config --modversion sdl3 freetype2 libcurl

      # On the bundled GLib (-Dglib=bundled): the one CI build of it, kept
      # working while the XP and portable builds are on nscore.
      - name: Build (ThinLTO via LLD on main, no LTO on pull requests)
        run: |
          export CC="ccache clang"
          export CC_LD=lld
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            meson setup builddir --werror -Db_lto=false -Dpdfjs=disabled -Dglib=bundled
          else
            meson setup builddir --werror -Db_lto=true -Db_lto_mode=thin -Dpdfjs=disabled -Dglib=bundled
            THINLTO_CACHE_DIR=$(cygpath -m "$RUNNER_TEMP/thinlto-cache")
            mkdir -p "$THINLTO_CACHE_DIR"
            meson configure builddir -Dc_link_args="-Wl,--thinlto-cache-dir=$THINLTO_CACHE_DIR -Wl,--thinlto-cache-policy=cache_size_bytes=300m"
          fi
          meson compile -C builddir

      - name: ccache stats
        if: always()
        run: ccache --show-stats

      - name: gfx test
        run: |
          mkdir -p gfx-test-out
          GFX_TEST_OUT="$(cygpath -m "$PWD/gfx-test-out")" meson test -C builddir --suite gfx --print-errorlogs

      - name: nsfc and SDL layer tests
        # The in-tree font finder (this build finds its fonts through
        # fontconfig), with one of Windows' own fonts to scan.
        run: |
          NSFC_TEST_FONT="C:/Windows/Fonts/arial.ttf" \
            meson test -C builddir --suite nsfc --suite plat --print-errorlogs

      - name: Upload the gfx test images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gfx-test-windows
          path: gfx-test-out
          retention-days: 7

      - name: Headless smoke (about:start)
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar.exe --headless --dump=text about:start > about.txt
          head -3 about.txt
          grep -q 'Search duckduckgo.com' about.txt

      - name: Headless JavaScript smoke
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar.exe --headless --dump=text --settle-ms=300 \
            'data:text/html,<p id="a">before</p><script>var a=document.getElementById("a");a.textContent="js-ok "+(6*7);setTimeout(function(){a.textContent+=" timer-ok"},50);</script>' \
            > js.txt
          cat js.txt
          grep -q 'js-ok 42 timer-ok' js.txt

      - name: Canvas 2D smoke
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar.exe --headless --dump=text --settle-ms=500 \
            "file:///$(cygpath -m "$PWD")/data/fixtures/canvas-2d.html" > canvas.txt
          grep -E '^(PASS|FAIL)' canvas.txt
          grep -q 'PASS toDataURL' canvas.txt
          ! grep -q '^FAIL' canvas.txt

      - name: Layers composite as painting in place does
        run: |
          # As on Linux: layers composited on the CPU for --dump=png, each
          # moved by whole pixels, give the image NS_LAYERS=0 paints.
          for page in 'layers-fixed.html?set=exact' 'layers-anim.html?set=exact'; do
            NS_LAYERS=log ./builddir/src/sdl/weststar.exe --headless --time-ms=1200 \
              --dump=png:layers-on.png "file:///$(cygpath -m "$PWD")/data/fixtures/$page" 2> layers.log
            NS_LAYERS=0 ./builddir/src/sdl/weststar.exe --headless --time-ms=1200 \
              --dump=png:layers-off.png "file:///$(cygpath -m "$PWD")/data/fixtures/$page"
            grep -E 'plan .*: layer' layers.log | sort -u
            grep -q -E 'plan (header|slide).*: layer' layers.log
            cmp layers-on.png layers-off.png
          done

      - name: Pattern attribute checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar.exe --headless --dump=text --settle-ms=1000 \
            "file:///$(cygpath -m "$PWD")/data/fixtures/pattern.html" > pattern.txt
          grep -E '^(PASS|FAIL)' pattern.txt
          grep -q 'PASS checkValidity' pattern.txt
          ! grep -q '^FAIL' pattern.txt

      - name: Web Crypto checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar.exe --headless --dump=text --settle-ms=3000 \
            "file:///$(cygpath -m "$PWD")/data/fixtures/webcrypto.html" > webcrypto.txt
          cat webcrypto.txt
          grep -q '^PASS' webcrypto.txt
          ! grep -q '^FAIL' webcrypto.txt
          grep -q '^END' webcrypto.txt

      - name: Text lines are painted where layout put them
        # 600 lines of a <pre> 22.8px apart in a box 13680px tall: paint
        # must draw the first at its top and the last at its bottom.
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar.exe --headless --inspect=pre \
            "file:///$(cygpath -m "$PWD")/data/fixtures/pre-line-pitch.html" > pitch.txt
          grep 'text lines' pitch.txt
          awk '/text lines/ { split($5, r, /\.\./); n = $3 + 0; t = r[1] + 0; b = r[2] + 0; ok = (n == 600 && t >= -1 && t <= 4 && b >= 13676 && b <= 13681) } END { exit !ok }' pitch.txt

      # nscore (-Dglib=native, src/core/) in place of GLib, beside the
      # same browser on the system GLib, both with nstext: no GLib DLL may
      # be imported, and the two must lay out and paint the fixtures byte
      # for byte alike (docs/porting-to-sdl.md, stage 6.5).
      - name: Build on GLib and on nscore (-Dglib=native)
        run: |
          export CC="ccache clang"
          export CC_LD=lld
          meson setup build-sys --werror -Db_lto=false -Dpdfjs=disabled -Dtext=native -Dglib=system
          meson setup build-nat --werror -Db_lto=false -Dpdfjs=disabled -Dtext=native -Dglib=native
          meson compile -C build-nat
          meson compile -C build-sys

      - name: No GLib or GObject DLL in the nscore binary
        run: |
          grep -q 'GLib *: none (nscore' build-nat/meson-logs/meson-log.txt
          objdump -p build-nat/src/sdl/weststar.exe | grep 'DLL Name'
          ! objdump -p build-nat/src/sdl/weststar.exe | grep -i -E 'DLL Name: lib(glib|gobject|gio)-'
          # Nor does any of its sources read a GLib header: only nscore's
          # tests against GLib may.
          ! ninja -C build-nat -t deps |
            awk '/^[^ ]/ { t = $1 } /glib-2\.0\/glib\.h/ { print t }' | grep -v 'vs-glib'

      - name: nscore tests, alone and against GLib
        run: meson test -C build-nat --suite nscore --print-errorlogs

      - name: nscore lays out and paints the fixtures as GLib does
        run: |
          fail=0
          root="file:///$(cygpath -m "$PWD")"
          for f in data/fixtures/*.html; do
            # webcrypto.html prints each result as it arrives: let it finish.
            settle=""
            case "$f" in *webcrypto.html) settle=--settle-ms=60000 ;; esac
            for b in sys nat; do
              ./build-$b/src/sdl/weststar.exe --headless --viewport=800x1000 $settle \
                --dump=layout "$root/$f" > "layout-$b.txt" 2>/dev/null || true
              ./build-$b/src/sdl/weststar.exe --headless --viewport=800x1000 $settle \
                --dump="png:shot-$b.png" "$root/$f" > /dev/null 2>&1 || true
            done
            res=same
            cmp -s layout-sys.txt layout-nat.txt || { res="layout DIFFERS"; fail=1; }
            cmp -s shot-sys.png shot-nat.png || { res="$res, picture DIFFERS"; fail=1; }
            echo "$(basename "$f"): $res"
            cmp -s layout-sys.txt layout-nat.txt || diff layout-sys.txt layout-nat.txt | head -20
          done
          for b in sys nat; do
            ./build-$b/src/sdl/weststar.exe --headless --dump=text about:start > "about-$b.txt"
            ./build-$b/src/sdl/weststar.exe --print-config > "config-$b.txt"
            ./build-$b/src/sdl/weststar.exe --headless --dump=text --settle-ms=3000 \
              "$root/data/fixtures/webcrypto.html" > "webcrypto-$b.txt"
          done
          grep -q '^END' webcrypto-nat.txt
          ! grep -q '^FAIL' webcrypto-nat.txt
          for t in about config webcrypto; do
            cmp "$t-sys.txt" "$t-nat.txt" || { diff "$t-sys.txt" "$t-nat.txt" | head -20; fail=1; }
          done
          exit $fail

      # The binary with the UCRT64 DLLs it links and fontconfig's
      # configuration: what a Windows package would hold.
      - name: Bundle
        run: |
          mkdir -p bundle/etc
          cp builddir/src/sdl/weststar.exe bundle/
          ldd bundle/weststar.exe | awk 'tolower($3) ~ /ucrt64/ {print $3}' | sort -u |
            while read -r dll; do cp "$dll" bundle/; done
          cp -r /ucrt64/etc/fonts bundle/etc/
          ls bundle
          # The browser must not link Cairo.
          ! ls bundle | grep -i -E 'cairo|pixman'

      # Run as an installed copy runs, with only the Windows system folders
      # on PATH, to catch a DLL the bundle left out.
      - name: Bundle starts without MSYS2 on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath bundle\weststar.exe `
                 -ArgumentList '--headless','--dump=text','about:start' `
                 -WorkingDirectory bundle -RedirectStandardOutput bundle-about.txt `
                 -RedirectStandardError bundle-about.err -NoNewWindow -Wait -PassThru
          Get-Content bundle-about.txt -TotalCount 3
          Get-Content bundle-about.err
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if (-not (Select-String -Quiet -Path bundle-about.txt -Pattern 'Search duckduckgo.com')) { throw 'about:start did not render' }

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weststar-windows-${{ matrix.windows }}-ucrt64
          path: bundle
          if-no-files-found: error
          retention-days: 14

      - name: Save ccache
        if: always() && steps.ccache-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}\ccache
            ${{ runner.temp }}\thinlto-cache
          key: ccache-windows-${{ matrix.windows }}-ucrt64-${{ github.sha }}

  # The Windows XP build: 32-bit, against msvcrt.dll, on SDL2 with the
  # portable profile, every library compiled for XP from its subproject and
  # linked statically (scripts/winxp-i686.ini). The runner is Windows
  # Server 2025, not XP: the import check stands in for XP itself.
  winxp:
    name: msys2/mingw32 for Windows XP (i686)
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      NS_ALLOW_ROOT: '1'

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up MSYS2 (mingw32)
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: MINGW32
          update: false
          cache: true
          # The toolchain, and the CA certificates compiled into the
          # browser; MINGW32's libraries are built for Windows 7, so none.
          install: >-
            git
            mingw-w64-i686-gcc
            mingw-w64-i686-binutils
            mingw-w64-i686-pkgconf
            mingw-w64-i686-meson
            mingw-w64-i686-ninja
            mingw-w64-i686-python
            mingw-w64-i686-ca-certificates

      - name: Restore the subproject downloads
        id: wraps-restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: subprojects/packagecache
          key: wraps-winxp-${{ hashFiles('subprojects/*.wrap') }}
          restore-keys: |
            wraps-winxp-

      - name: Show toolchain versions
        run: |
          gcc --version
          gcc -dumpmachine
          meson --version
          ninja --version

      - name: Build
        run: |
          meson setup builddir-xp --werror --native-file scripts/winxp-i686.ini \
            -Dpdfjs=disabled -Dca_bundle=/mingw32/etc/ssl/certs/ca-bundle.crt
          meson compile -C builddir-xp
          # On nscore, with no GLib built.
          grep -q 'GLib *: none (nscore' builddir-xp/meson-logs/meson-log.txt

      - name: Save the subproject downloads
        if: steps.wraps-restore.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: subprojects/packagecache
          key: wraps-winxp-${{ hashFiles('subprojects/*.wrap') }}

      # Every function weststar.exe imports must be one that Windows XP SP3
      # exports, and its header must ask for no more than Windows 5.1.
      - name: Windows XP import check
        run: |
          python3 scripts/check-xp-imports.py --cache "$RUNNER_TEMP/xp-exports" \
            builddir-xp/src/sdl/weststar.exe

      - name: Rasterizer, platform, font finder and nscore tests
        run: |
          NSFC_TEST_FONT="C:/Windows/Fonts/arial.ttf" \
            meson test -C builddir-xp --suite gfx --suite nsfc --suite plat --suite nscore --print-errorlogs

      - name: Headless smoke (about:start)
        run: |
          set -o pipefail
          ./builddir-xp/src/sdl/weststar.exe --headless --dump=text about:start > about.txt
          head -3 about.txt
          grep -q 'Search duckduckgo.com' about.txt

      - name: Headless JavaScript smoke
        run: |
          set -o pipefail
          ./builddir-xp/src/sdl/weststar.exe --headless --dump=text --settle-ms=300 \
            'data:text/html,<p id="a">before</p><script>var a=document.getElementById("a");a.textContent="js-ok "+(6*7);setTimeout(function(){a.textContent+=" timer-ok"},50);</script>' \
            > js.txt
          cat js.txt
          grep -q 'js-ok 42 timer-ok' js.txt

      - name: Canvas 2D smoke
        run: |
          set -o pipefail
          ./builddir-xp/src/sdl/weststar.exe --headless --dump=text --settle-ms=500 \
            "file:///$(cygpath -m "$PWD")/data/fixtures/canvas-2d.html" > canvas.txt
          grep -E '^(PASS|FAIL)' canvas.txt
          grep -q 'PASS toDataURL' canvas.txt
          ! grep -q '^FAIL' canvas.txt

      - name: Web Crypto checks
        run: |
          set -o pipefail
          ./builddir-xp/src/sdl/weststar.exe --headless --dump=text --settle-ms=60000 \
            "file:///$(cygpath -m "$PWD")/data/fixtures/webcrypto.html" > webcrypto.txt
          cat webcrypto.txt
          grep -q '^PASS' webcrypto.txt
          ! grep -q '^FAIL' webcrypto.txt
          grep -q '^END' webcrypto.txt

      # Linked statically: the executable alone (the import check above
      # has already refused any DLL but the system's).
      - name: Bundle
        run: |
          mkdir -p bundle
          cp builddir-xp/src/sdl/weststar.exe LICENSE THIRD-PARTY-LICENSES.md bundle/
          objdump -p bundle/weststar.exe | grep 'DLL Name'

      - name: Bundle starts without MSYS2 on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $p = Start-Process -FilePath bundle\weststar.exe `
                 -ArgumentList '--headless','--dump=text','about:start' `
                 -WorkingDirectory bundle -RedirectStandardOutput bundle-about.txt `
                 -RedirectStandardError bundle-about.err -NoNewWindow -Wait -PassThru
          Get-Content bundle-about.txt -TotalCount 3
          Get-Content bundle-about.err
          if ($p.ExitCode -ne 0) { throw "exit code $($p.ExitCode)" }
          if (-not (Select-String -Quiet -Path bundle-about.txt -Pattern 'Search duckduckgo.com')) { throw 'about:start did not render' }

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weststar-winxp-i686
          path: bundle
          if-no-files-found: error
          retention-days: 14
