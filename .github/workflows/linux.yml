name: linux

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: gcc on ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      NS_ALLOW_ROOT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build git \
            libsdl3-dev libcurl4-openssl-dev libssl-dev \
            libharfbuzz-dev libfribidi-dev libfontconfig-dev \
            libfreetype-dev libpsl-dev libsqlite3-dev libseccomp-dev \
            libglib2.0-dev zlib1g-dev libbrotli-dev libzstd-dev \
            libopusfile-dev libvorbis-dev xvfb xauth fonts-dejavu-core \
            libsdl2-dev

      - name: Configure and build
        run: |
          set -o pipefail
          # Pull requests build without LTO (faster to link); pushes to main
          # keep the release configuration with LTO.
          lto=true; [ "$GITHUB_EVENT_NAME" = pull_request ] && lto=false
          meson setup builddir --werror -Db_lto=$lto -Dpdfjs=disabled
          meson compile -C builddir 2>&1 | tee build.log

      - name: gfx test
        run: |
          mkdir -p gfx-test-out
          GFX_TEST_OUT="$PWD/gfx-test-out" meson test -C builddir --suite gfx --print-errorlogs

      - name: Upload the gfx test images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gfx-test-linux
          path: gfx-test-out
          retention-days: 7

      - name: nsfc and SDL layer tests
        # The in-tree font finder, built and tested here although this
        # build finds its fonts through fontconfig; and both again on
        # SDL2 (libsdl2-dev), which the browser itself does not use yet.
        run: |
          NSFC_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            meson test -C builddir --suite nsfc --suite plat --print-errorlogs
          meson test -C builddir --list | grep -q 'ns_sys-sdl2'
          meson test -C builddir --list | grep -q 'nsfc-sdl2'

      - name: No GTK, Cairo or GIO in the binary
        run: |
          test -x builddir/src/sdl/weststar
          ! ldd builddir/src/sdl/weststar | grep -i -E 'libgtk|libgdk|libcairo|libpixman'
          ! objdump -p builddir/src/sdl/weststar | grep -E 'NEEDED +libgio'
          ldd builddir/src/sdl/weststar | grep -i libSDL3

      - name: Headless smoke (about:start)
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text about:start > about.txt
          head -3 about.txt
          grep -q 'Search duckduckgo.com' about.txt

      - name: Headless JavaScript smoke
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=300 \
            'data:text/html,<p id="a">before</p><script>var a=document.getElementById("a");a.textContent="js-ok "+(6*7);setTimeout(function(){a.textContent+=" timer-ok"},50);</script>' \
            > js.txt
          cat js.txt
          grep -q 'js-ok 42 timer-ok' js.txt

      - name: Canvas 2D smoke
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=500 \
            "file://$PWD/data/fixtures/canvas-2d.html" > canvas.txt
          grep -E '^(PASS|FAIL)' canvas.txt
          grep -q 'PASS toDataURL' canvas.txt
          ! grep -q '^FAIL' canvas.txt

      - name: Pattern attribute checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=1000 \
            "file://$PWD/data/fixtures/pattern.html" > pattern.txt
          grep -E '^(PASS|FAIL)' pattern.txt
          grep -q 'PASS checkValidity' pattern.txt
          ! grep -q '^FAIL' pattern.txt

      - name: Web Crypto checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=3000 \
            "file://$PWD/data/fixtures/webcrypto.html" > webcrypto.txt
          grep -E '^(PASS|FAIL|SKIP)' webcrypto.txt
          grep -q '^PASS' webcrypto.txt
          ! grep -q '^FAIL' webcrypto.txt

      - name: No WebGL, no video
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=300 \
            'data:text/html,<p id="a"></p><script>var c=document.createElement("canvas");document.getElementById("a").textContent="gl="+c.getContext("webgl")+" mp4=["+document.createElement("video").canPlayType("video/mp4")+"] ms="+typeof MediaSource;</script>' \
            > nofeat.txt
          cat nofeat.txt
          grep -q 'gl=null mp4=\[\] ms=undefined' nofeat.txt

      - name: GUI smoke (SDL window under Xvfb)
        run: |
          # The browser must still be running after five seconds. Its own
          # exit status is recorded inside the Xvfb session: xvfb-run can
          # fail on its own when cleaning up its temporary directory.
          xvfb-run -a -s '-screen 0 1280x900x24' sh -c \
            'timeout 5 ./builddir/src/sdl/weststar --no-watchdog about:start; echo $? > gui.status' \
            > gui.log 2>&1 || true
          cat gui.log
          test "$(cat gui.status)" = 124

  portable:
    # The portable build profile: mbedTLS (fetched as a meson subproject)
    # instead of OpenSSL, nsfc, the in-tree font finder, instead of
    # fontconfig, which is not even installed, CA certificates compiled
    # in, the C11 language level older toolchains stop at, and GLib built
    # from the pinned release instead of taken from the system. Algorithms mbedTLS lacks (EdDSA) must report NotSupportedError
    # (SKIP), never fail.
    name: gcc on ubuntu-26.04, portable profile
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      NS_ALLOW_ROOT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build git \
            libsdl3-dev libcurl4-openssl-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype-dev libpsl-dev libsqlite3-dev libseccomp-dev \
            libglib2.0-dev zlib1g-dev libbrotli-dev libzstd-dev \
            fonts-dejavu-core ca-certificates

      - name: Configure and build
        run: |
          meson setup builddir --werror -Db_lto=false -Dpdfjs=disabled \
            -Dcrypto=mbedtls -Dfontconfig=disabled \
            -Dca_bundle=/etc/ssl/certs/ca-certificates.crt -Dc_std=gnu11 \
            -Dglib=bundled
          meson compile -C builddir

      - name: No libcrypto, fontconfig or GLib in the binary
        run: |
          # curl may bring its own TLS library, and the distribution's
          # HarfBuzz its own GLib; Weststar itself must not link OpenSSL's
          # libcrypto, fontconfig, or the system's GLib and GObject.
          ! objdump -p builddir/src/sdl/weststar | grep -E 'NEEDED +(libcrypto|libfontconfig|libglib|libgobject)'

      - name: nsfc and SDL layer tests
        run: |
          NSFC_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            meson test -C builddir --suite nsfc --suite plat --print-errorlogs

      - name: Headless smoke (about:start)
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text about:start > about.txt
          grep -q 'Search duckduckgo.com' about.txt

      - name: Canvas and pattern checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=500 \
            "file://$PWD/data/fixtures/canvas-2d.html" > canvas.txt
          grep -q 'PASS toDataURL' canvas.txt
          ! grep -q '^FAIL' canvas.txt
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=1000 \
            "file://$PWD/data/fixtures/pattern.html" > pattern.txt
          grep -q 'PASS checkValidity' pattern.txt
          ! grep -q '^FAIL' pattern.txt

      - name: Text is drawn with the fonts nsfc found
        run: |
          # A canvas with a word on it has ink, and the word a width, only
          # if a font was found and its glyphs rasterized. The second run
          # reads the font list from the cache the first one wrote.
          for run in first second; do
            ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=300 \
              'data:text/html,<canvas id="c" width="200" height="50"></canvas><p id="o"></p><script>var c=document.getElementById("c"),x=c.getContext("2d");x.font="30px sans-serif";x.fillText("Weststar",5,35);var d=x.getImageData(0,0,200,50).data,n=0;for(var i=3;i<d.length;i+=4)if(d[i])n++;document.getElementById("o").textContent="ink="+(n>300?"ok":"none:"+n)+" width="+(x.measureText("Weststar").width>50?"ok":"bad");</script>' \
              > text.txt
            cat text.txt
            grep -q 'ink=ok width=ok' text.txt
            test -s "$HOME/.cache/weststar/fonts.cache"
          done

      - name: Web Crypto checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=3000 \
            "file://$PWD/data/fixtures/webcrypto.html" > webcrypto.txt
          grep -E '^(PASS|FAIL|SKIP)' webcrypto.txt
          grep -q '^PASS' webcrypto.txt
          ! grep -q '^FAIL' webcrypto.txt
