name: linux

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: gcc on ubuntu-26.04
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      NS_ALLOW_ROOT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build git \
            libsdl3-dev libcurl4-openssl-dev libssl-dev \
            libharfbuzz-dev libfribidi-dev libfontconfig-dev \
            libfreetype-dev libpsl-dev libsqlite3-dev libseccomp-dev \
            libglib2.0-dev zlib1g-dev libbrotli-dev libzstd-dev \
            libopusfile-dev libvorbis-dev xvfb xauth fonts-dejavu-core \
            libsdl2-dev

      - name: Configure and build
        run: |
          set -o pipefail
          # Pull requests build without LTO (faster to link); pushes to main
          # keep the release configuration with LTO.
          lto=true; [ "$GITHUB_EVENT_NAME" = pull_request ] && lto=false
          meson setup builddir --werror -Db_lto=$lto -Dpdfjs=disabled
          meson compile -C builddir 2>&1 | tee build.log

      - name: gfx test
        run: |
          mkdir -p gfx-test-out
          GFX_TEST_OUT="$PWD/gfx-test-out" meson test -C builddir --suite gfx --print-errorlogs

      - name: Upload the gfx test images
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gfx-test-linux
          path: gfx-test-out
          retention-days: 7

      - name: nsfc and SDL layer tests
        # The in-tree font finder, built and tested here although this
        # build finds its fonts through fontconfig; and both again on
        # SDL2 (libsdl2-dev). The whole browser on SDL2: the sdl2 job.
        run: |
          NSFC_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            meson test -C builddir --suite nsfc --suite plat --print-errorlogs
          meson test -C builddir --list | grep -q 'ns_sys-sdl2'
          meson test -C builddir --list | grep -q 'nsfc-sdl2'

      - name: No GTK, Cairo or GIO in the binary
        run: |
          test -x builddir/src/sdl/weststar
          ! ldd builddir/src/sdl/weststar | grep -i -E 'libgtk|libgdk|libcairo|libpixman'
          ! objdump -p builddir/src/sdl/weststar | grep -E 'NEEDED +libgio'
          ldd builddir/src/sdl/weststar | grep -i libSDL3

      - name: Headless smoke (about:start)
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text about:start > about.txt
          head -3 about.txt
          grep -q 'Search duckduckgo.com' about.txt

      - name: Headless JavaScript smoke
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=300 \
            'data:text/html,<p id="a">before</p><script>var a=document.getElementById("a");a.textContent="js-ok "+(6*7);setTimeout(function(){a.textContent+=" timer-ok"},50);</script>' \
            > js.txt
          cat js.txt
          grep -q 'js-ok 42 timer-ok' js.txt

      - name: Canvas 2D smoke
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=500 \
            "file://$PWD/data/fixtures/canvas-2d.html" > canvas.txt
          grep -E '^(PASS|FAIL)' canvas.txt
          grep -q 'PASS toDataURL' canvas.txt
          ! grep -q '^FAIL' canvas.txt

      - name: Layers composite as painting in place does
        run: |
          # --dump=png paints fixed boxes and elements animating transform
          # or opacity into layers and composites them on the CPU. Each
          # layer here moves by whole pixels, so the image must be byte for
          # byte the one NS_LAYERS=0 paints, and the layers must be there.
          for page in 'layers-fixed.html?set=exact' 'layers-anim.html?set=exact'; do
            NS_LAYERS=log ./builddir/src/sdl/weststar --headless --time-ms=1200 \
              --dump=png:layers-on.png "file://$PWD/data/fixtures/$page" 2> layers.log
            NS_LAYERS=0 ./builddir/src/sdl/weststar --headless --time-ms=1200 \
              --dump=png:layers-off.png "file://$PWD/data/fixtures/$page"
            grep -E 'plan .*: layer' layers.log | sort -u
            grep -q -E 'plan (header|slide).*: layer' layers.log
            cmp layers-on.png layers-off.png
          done

      - name: Pattern attribute checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=1000 \
            "file://$PWD/data/fixtures/pattern.html" > pattern.txt
          grep -E '^(PASS|FAIL)' pattern.txt
          grep -q 'PASS checkValidity' pattern.txt
          ! grep -q '^FAIL' pattern.txt

      - name: Web Crypto checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=3000 \
            "file://$PWD/data/fixtures/webcrypto.html" > webcrypto.txt
          cat webcrypto.txt
          grep -q '^PASS' webcrypto.txt
          ! grep -q '^FAIL' webcrypto.txt
          grep -q '^END' webcrypto.txt

      - name: Text lines are painted where layout put them
        # 600 lines of a <pre> 22.8px apart in a box 13680px tall: paint
        # must draw the first at its top and the last at its bottom.
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --inspect=pre \
            "file://$PWD/data/fixtures/pre-line-pitch.html" > pitch.txt
          grep 'text lines' pitch.txt
          awk '/text lines/ { split($5, r, /\.\./); n = $3 + 0; t = r[1] + 0; b = r[2] + 0; ok = (n == 600 && t >= -1 && t <= 4 && b >= 13676 && b <= 13681) } END { exit !ok }' pitch.txt

      - name: No WebGL, no video
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=300 \
            'data:text/html,<p id="a"></p><script>var c=document.createElement("canvas");document.getElementById("a").textContent="gl="+c.getContext("webgl")+" mp4=["+document.createElement("video").canPlayType("video/mp4")+"] ms="+typeof MediaSource;</script>' \
            > nofeat.txt
          cat nofeat.txt
          grep -q 'gl=null mp4=\[\] ms=undefined' nofeat.txt

      - name: GUI smoke (SDL window under Xvfb)
        run: |
          # The browser must still be running after five seconds. Its own
          # exit status is recorded inside the Xvfb session: xvfb-run can
          # fail on its own when cleaning up its temporary directory.
          xvfb-run -a -s '-screen 0 1280x900x24' sh -c \
            'timeout 5 ./builddir/src/sdl/weststar --no-watchdog about:start; echo $? > gui.status' \
            > gui.log 2>&1 || true
          cat gui.log
          test "$(cat gui.status)" = 124

  sdl2:
    # The whole browser on SDL2 (-Dsdl=sdl2), as Windows XP and the Amiga
    # family build it: genuine SDL2, the release pinned in
    # subprojects/sdl2.wrap, built here as a shared library. Neither
    # libsdl3-dev nor libsdl2-dev (which may be sdl2-compat, SDL2's API
    # over SDL3) is installed; SDL2 gets the X11, OpenGL and sound
    # headers it builds its backends from.
    name: gcc on ubuntu-26.04, SDL2
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      NS_ALLOW_ROOT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build git \
            libcurl4-openssl-dev libssl-dev \
            libharfbuzz-dev libfribidi-dev libfontconfig-dev \
            libfreetype-dev libpsl-dev libsqlite3-dev libseccomp-dev \
            libglib2.0-dev zlib1g-dev libbrotli-dev libzstd-dev \
            libopusfile-dev libvorbis-dev xvfb xauth fonts-dejavu-core \
            libx11-dev libxext-dev libxi-dev libxrandr-dev libxfixes-dev \
            libxcursor-dev libxkbcommon-dev libgl-dev libegl-dev \
            libasound2-dev libpulse-dev

      - name: Configure and build
        run: |
          meson setup builddir --werror -Db_lto=false -Dpdfjs=disabled \
            -Dsdl=sdl2 --force-fallback-for=sdl2 \
            -Dsdl2:default_library=shared
          meson compile -C builddir

      - name: The binary uses SDL2 from the wrap, and no SDL3
        run: |
          ldd builddir/src/sdl/weststar | grep -i libsdl
          ldd builddir/src/sdl/weststar | grep -E 'libSDL2-2\.0\.so.* => .*/subprojects/SDL2-[0-9.]+/'
          ! ldd builddir/src/sdl/weststar | grep -i libSDL3

      - name: gfx, nsfc and SDL layer tests
        run: |
          NSFC_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            meson test -C builddir --suite gfx --suite nsfc --suite plat \
            --print-errorlogs

      - name: Headless smokes
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text about:start > about.txt
          grep -q 'Search duckduckgo.com' about.txt
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=300 \
            'data:text/html,<p id="a">before</p><script>var a=document.getElementById("a");a.textContent="js-ok "+(6*7);setTimeout(function(){a.textContent+=" timer-ok"},50);</script>' \
            > js.txt
          cat js.txt
          grep -q 'js-ok 42 timer-ok' js.txt
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=500 \
            "file://$PWD/data/fixtures/canvas-2d.html" > canvas.txt
          grep -q 'PASS toDataURL' canvas.txt
          ! grep -q '^FAIL' canvas.txt
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=3000 \
            "file://$PWD/data/fixtures/webcrypto.html" > webcrypto.txt
          grep -q '^PASS' webcrypto.txt
          ! grep -q '^FAIL' webcrypto.txt
          grep -q '^END' webcrypto.txt

      - name: GUI smoke (SDL2 window under Xvfb)
        run: |
          # As in the SDL3 job: still running after five seconds, its exit
          # status recorded inside the Xvfb session.
          xvfb-run -a -s '-screen 0 1280x900x24' sh -c \
            'timeout 5 ./builddir/src/sdl/weststar --no-watchdog about:start; echo $? > gui.status' \
            > gui.log 2>&1 || true
          cat gui.log
          test "$(cat gui.status)" = 124

  portable:
    # The portable build profile: mbedTLS (fetched as a meson subproject)
    # instead of OpenSSL, nsfc, the in-tree font finder, instead of
    # fontconfig, which is not even installed, CA certificates compiled
    # in, the C11 language level older toolchains stop at, and GLib built
    # from the pinned release instead of taken from the system. Algorithms mbedTLS lacks (EdDSA) must report NotSupportedError
    # (SKIP), never fail.
    name: gcc on ubuntu-26.04, portable profile
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    env:
      DEBIAN_FRONTEND: noninteractive
      NS_ALLOW_ROOT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build git \
            libsdl3-dev libcurl4-openssl-dev \
            libharfbuzz-dev libfribidi-dev \
            libfreetype-dev libpsl-dev libsqlite3-dev libseccomp-dev \
            libglib2.0-dev zlib1g-dev libbrotli-dev libzstd-dev \
            fonts-dejavu-core ca-certificates

      - name: Configure and build
        run: |
          meson setup builddir --werror -Db_lto=false -Dpdfjs=disabled \
            -Dcrypto=mbedtls -Dfontconfig=disabled \
            -Dca_bundle=/etc/ssl/certs/ca-certificates.crt -Dc_std=gnu11 \
            -Dglib=bundled
          meson compile -C builddir

      - name: No libcrypto, fontconfig or GLib in the binary
        run: |
          # curl may bring its own TLS library, and the distribution's
          # HarfBuzz its own GLib; Weststar itself must not link OpenSSL's
          # libcrypto, fontconfig, or the system's GLib and GObject.
          ! objdump -p builddir/src/sdl/weststar | grep -E 'NEEDED +(libcrypto|libfontconfig|libglib|libgobject)'

      - name: nsfc and SDL layer tests
        run: |
          NSFC_TEST_FONT=/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf \
            meson test -C builddir --suite nsfc --suite plat --print-errorlogs

      - name: Headless smoke (about:start)
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text about:start > about.txt
          grep -q 'Search duckduckgo.com' about.txt

      - name: Canvas and pattern checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=500 \
            "file://$PWD/data/fixtures/canvas-2d.html" > canvas.txt
          grep -q 'PASS toDataURL' canvas.txt
          ! grep -q '^FAIL' canvas.txt
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=1000 \
            "file://$PWD/data/fixtures/pattern.html" > pattern.txt
          grep -q 'PASS checkValidity' pattern.txt
          ! grep -q '^FAIL' pattern.txt

      - name: Text is drawn with the fonts nsfc found
        run: |
          # A canvas with a word on it has ink, and the word a width, only
          # if a font was found and its glyphs rasterized. The second run
          # reads the font list from the cache the first one wrote.
          for run in first second; do
            ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=300 \
              'data:text/html,<canvas id="c" width="200" height="50"></canvas><p id="o"></p><script>var c=document.getElementById("c"),x=c.getContext("2d");x.font="30px sans-serif";x.fillText("Weststar",5,35);var d=x.getImageData(0,0,200,50).data,n=0;for(var i=3;i<d.length;i+=4)if(d[i])n++;document.getElementById("o").textContent="ink="+(n>300?"ok":"none:"+n)+" width="+(x.measureText("Weststar").width>50?"ok":"bad");</script>' \
              > text.txt
            cat text.txt
            grep -q 'ink=ok width=ok' text.txt
            test -s "$HOME/.cache/weststar/fonts.cache"
          done

      - name: Text is drawn from the bundled fonts alone
        run: |
          # NS_NO_SYSTEM_FONTS hides the system's fonts from nsfc, as on a
          # system with none; Latin, Greek and Cyrillic in sans-serif, serif
          # and monospace must still have ink, from the DejaVu fonts the
          # build compiled in (-Dbundled_fonts, auto with nsfc). Without
          # them no font is found and each letter is an empty box, about
          # 300 pixels of ink for a word here; drawn, it is 900 to 1500.
          grep -q 'Bundled fallback fonts *: DejaVu' builddir/meson-logs/meson-log.txt
          NS_NO_SYSTEM_FONTS=1 ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=300 \
            'data:text/html,<canvas id="c" width="400" height="60"></canvas><p id="o"></p><script>var c=document.getElementById("c"),x=c.getContext("2d"),r=[];function ink(f,t){x.clearRect(0,0,400,60);x.font="30px "+f;x.fillText(t,5,40);var d=x.getImageData(0,0,400,60).data,n=0;for(var i=3;i<d.length;i+=4)if(d[i])n++;return n>600?"ok":"none:"+n;}r.push("latin="+ink("sans-serif","Weststar"));r.push("greek="+ink("sans-serif","\u0395\u03bb\u03bb\u03b7\u03bd\u03b9\u03ba\u03ac"));r.push("cyrillic="+ink("serif","\u041a\u0438\u0440\u0438\u043b\u043b\u0438\u0446\u0430"));r.push("mono="+ink("monospace","Monospace"));document.getElementById("o").textContent=r.join(" ");</script>' \
            > bundled.txt
          cat bundled.txt
          grep -q 'latin=ok greek=ok cyrillic=ok mono=ok' bundled.txt

      - name: Web Crypto checks
        run: |
          set -o pipefail
          ./builddir/src/sdl/weststar --headless --dump=text --settle-ms=3000 \
            "file://$PWD/data/fixtures/webcrypto.html" > webcrypto.txt
          cat webcrypto.txt
          grep -q '^PASS' webcrypto.txt
          ! grep -q '^FAIL' webcrypto.txt
          grep -q '^END' webcrypto.txt

  text-native:
    # The browser with nstext (-Dtext=native, src/text/, the default): no
    # Pango and no GObject in it. It is built beside the Pango fork
    # (-Dtext=pango) and the two lay the fixtures out alike; see
    # docs/text-layout.md.
    name: gcc on ubuntu-26.04, nstext against Pango
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    env:
      DEBIAN_FRONTEND: noninteractive
      NS_ALLOW_ROOT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build git \
            libsdl3-dev libcurl4-openssl-dev libssl-dev \
            libharfbuzz-dev libfribidi-dev libfontconfig-dev \
            libfreetype-dev libpsl-dev libsqlite3-dev libseccomp-dev \
            libglib2.0-dev zlib1g-dev libbrotli-dev libzstd-dev \
            libthai-dev fonts-dejavu-core fonts-noto-core

      - name: Configure and build both text libraries
        run: |
          meson setup build-pango --werror -Db_lto=false -Dpdfjs=disabled -Dtext=pango
          meson setup build-native --werror -Db_lto=false -Dpdfjs=disabled -Dtext=native
          meson compile -C build-native
          meson compile -C build-pango

      - name: No Pango or GObject in the nstext binary
        run: |
          grep -q 'Text layout *: nstext' build-native/meson-logs/meson-log.txt
          ! objdump -p build-native/src/sdl/weststar | grep -E 'NEEDED +libgobject'

      - name: Headless smokes with nstext
        run: |
          set -o pipefail
          bin=./build-native/src/sdl/weststar
          $bin --headless --dump=text about:start > about.txt
          grep -q 'Search duckduckgo.com' about.txt
          $bin --headless --dump=text --settle-ms=500 \
            "file://$PWD/data/fixtures/canvas-2d.html" > canvas.txt
          test "$(grep -c '^PASS' canvas.txt)" -ge 21
          ! grep -q '^FAIL' canvas.txt
          $bin --headless --dump=text --settle-ms=1000 \
            "file://$PWD/data/fixtures/pattern.html" > pattern.txt
          grep -q 'PASS checkValidity' pattern.txt
          ! grep -q '^FAIL' pattern.txt
          $bin --headless --dump=text --settle-ms=3000 \
            "file://$PWD/data/fixtures/webcrypto.html" > webcrypto.txt
          cat webcrypto.txt
          grep -q '^PASS' webcrypto.txt
          ! grep -q '^FAIL' webcrypto.txt
          grep -q '^END' webcrypto.txt

      - name: nstext ellipsizes and justifies as Pango does
        run: |
          # The middle ellipsis and carets inside an ellipsis, which no
          # fixture reaches (src/text/tests/text-layout-dump.c). Layouts,
          # positions and hits must agree; the pixel hashes are reported.
          ninja -C build-pango text-layout-dump
          ninja -C build-native text-layout-dump
          ./build-pango/text-layout-dump > dump-pango.txt
          ./build-native/text-layout-dump > dump-native.txt
          diff dump-pango.txt dump-native.txt || true
          diff <(grep -v '^  pixels' dump-pango.txt) <(grep -v '^  pixels' dump-native.txt)

      - name: nstext lays the fixtures out as Pango does
        run: |
          # Boxes, line breaks and glyph positions must agree; the pictures
          # are compared and reported, not required to match byte for byte
          # (complex scripts may differ by a mark's phase).
          fail=0
          crashed=""
          for f in data/fixtures/*.html; do
            # webcrypto.html prints each result as it arrives: let it
            # finish (settle returns once the page is idle).
            settle=""
            case "$f" in *webcrypto.html) settle=--settle-ms=60000 ;; esac
            for lib in pango native; do
              rc=0
              ./build-$lib/src/sdl/weststar --headless --viewport=800x1000 $settle \
                --dump=layout "file://$PWD/$f" > "layout-$lib.txt" 2>/dev/null || rc=$?
              [ "$rc" -ge 128 ] && crashed="$crashed $lib:$f"
              ./build-$lib/src/sdl/weststar --headless --viewport=800x1000 \
                --dump="png:shot-$lib.png" "file://$PWD/$f" > /dev/null 2>&1 || true
            done
            if cmp -s layout-pango.txt layout-native.txt; then layout=same; else layout=DIFFERS; fail=1; fi
            if cmp -s shot-pango.png shot-native.png; then png=same; else png=differs; fi
            echo "$(basename "$f"): layout $layout, picture $png"
            [ "$layout" = same ] || diff layout-pango.txt layout-native.txt | head -20
          done
          # A crash is shown with its backtrace, from a build with symbols.
          if [ -n "$crashed" ]; then
            fail=1
            sudo apt-get install -y --no-install-recommends gdb valgrind > /dev/null
            for c in $crashed; do
              lib=${c%%:*}; f=${c#*:}
              [ -d build-dbg-$lib ] || {
                meson setup build-dbg-$lib -Dbuildtype=debug -Db_lto=false \
                  -Dpdfjs=disabled -Dtext=$lib > /dev/null
                meson compile -C build-dbg-$lib src/sdl/weststar > /dev/null
              }
              echo "=== $lib crashed on $f"
              # The system libraries' lines come from Ubuntu's debuginfod.
              DEBUGINFOD_URLS=https://debuginfod.ubuntu.com \
                gdb -batch -ex 'set debuginfod enabled on' -ex run -ex 'bt 40' \
                --args ./build-dbg-$lib/src/sdl/weststar \
                --headless --viewport=800x1000 --dump=layout "file://$PWD/$f" 2>&1 \
                | grep -vE '^\[(New|Thread|Inferior)|^Download' | tail -60
              echo "=== valgrind, $lib on $f"
              valgrind --error-limit=no --num-callers=30 --track-origins=yes \
                ./build-dbg-$lib/src/sdl/weststar \
                --headless --viewport=800x1000 --dump=layout "file://$PWD/$f" \
                2>&1 > /dev/null | grep -A32 -m4 -E 'Invalid|uninitialised|Process terminating' || true
            done
          fi
          exit $fail

  glib-native:
    # The browser on nscore (-Dglib=native, src/core/) in place of GLib:
    # no GLib or GObject linked. It is built beside the same browser on
    # the system GLib, both with nstext, and the two must lay out and
    # paint the fixtures byte for byte alike; see docs/porting-to-sdl.md,
    # stage 6.5.
    name: gcc on ubuntu-26.04, nscore against GLib
    runs-on: ubuntu-26.04
    timeout-minutes: 50
    env:
      DEBIAN_FRONTEND: noninteractive
      NS_ALLOW_ROOT: '1'

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install build dependencies
        # GLib only for the GLib build and nscore's tests against it.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config meson ninja-build git \
            libsdl3-dev libcurl4-openssl-dev libssl-dev \
            libharfbuzz-dev libfribidi-dev libfontconfig-dev \
            libfreetype-dev libpsl-dev libsqlite3-dev libseccomp-dev \
            libglib2.0-dev zlib1g-dev libbrotli-dev libzstd-dev \
            libthai-dev fonts-dejavu-core fonts-noto-core

      - name: Configure and build on GLib and on nscore
        run: |
          meson setup build-sys --werror -Db_lto=false -Dpdfjs=disabled -Dtext=native -Dglib=system
          meson setup build-nat --werror -Db_lto=false -Dpdfjs=disabled -Dtext=native -Dglib=native
          meson compile -C build-nat
          meson compile -C build-sys

      - name: No GLib or GObject in the nscore binary
        run: |
          grep -q 'GLib *: none (nscore' build-nat/meson-logs/meson-log.txt
          objdump -p build-nat/src/sdl/weststar | grep NEEDED
          ! objdump -p build-nat/src/sdl/weststar | grep -E 'NEEDED +lib(glib|gobject|gio)-'
          # Nor does any of its sources read a GLib header: only nscore's
          # tests against GLib may.
          ! ninja -C build-nat -t deps |
            awk '/^[^ ]/ { t = $1 } /glib-2\.0\/glib\.h/ { print t }' | grep -v 'vs-glib'

      - name: nscore tests, alone and against GLib
        run: meson test -C build-nat --suite nscore --print-errorlogs

      - name: Headless smokes on nscore
        run: |
          set -o pipefail
          bin=./build-nat/src/sdl/weststar
          $bin --headless --dump=text about:start > about.txt
          grep -q 'Search duckduckgo.com' about.txt
          $bin --headless --dump=text --settle-ms=3000 \
            "file://$PWD/data/fixtures/webcrypto.html" > webcrypto.txt
          grep -q '^PASS' webcrypto.txt
          ! grep -q '^FAIL' webcrypto.txt
          grep -q '^END' webcrypto.txt

      - name: nscore lays out and paints the fixtures as GLib does
        run: |
          fail=0
          for f in data/fixtures/*.html; do
            # webcrypto.html prints each result as it arrives: let it finish.
            settle=""
            case "$f" in *webcrypto.html) settle=--settle-ms=60000 ;; esac
            for b in sys nat; do
              ./build-$b/src/sdl/weststar --headless --viewport=800x1000 $settle \
                --dump=layout "file://$PWD/$f" > "layout-$b.txt" 2>/dev/null || true
              ./build-$b/src/sdl/weststar --headless --viewport=800x1000 $settle \
                --dump="png:shot-$b.png" "file://$PWD/$f" > /dev/null 2>&1 || true
            done
            res=same
            cmp -s layout-sys.txt layout-nat.txt || { res="layout DIFFERS"; fail=1; }
            cmp -s shot-sys.png shot-nat.png || { res="$res, picture DIFFERS"; fail=1; }
            echo "$(basename "$f"): $res"
            cmp -s layout-sys.txt layout-nat.txt || diff layout-sys.txt layout-nat.txt | head -20
          done
          for b in sys nat; do
            ./build-$b/src/sdl/weststar --headless --dump=text about:start > "about-$b.txt"
            ./build-$b/src/sdl/weststar --print-config > "config-$b.txt"
            ./build-$b/src/sdl/weststar --headless --dump=text --settle-ms=3000 \
              "file://$PWD/data/fixtures/webcrypto.html" > "webcrypto-$b.txt"
          done
          for t in about config webcrypto; do
            cmp "$t-sys.txt" "$t-nat.txt" || { diff "$t-sys.txt" "$t-nat.txt" | head -20; fail=1; }
          done
          exit $fail
