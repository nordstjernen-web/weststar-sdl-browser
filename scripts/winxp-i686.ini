# The Windows XP build: a meson native file for MSYS2's MINGW32 environment
# (i686, msvcrt.dll), the 32-bit browser on SDL2 with the portable profile.
#
#   meson setup builddir-xp --native-file scripts/winxp-i686.ini \
#         -Dca_bundle=/mingw32/etc/ssl/certs/ca-bundle.crt
#
# Everything is compiled for Windows XP (_WIN32_WINNT 0x0501), so the
# Windows headers declare nothing newer, and linked statically: the
# libraries the system cannot supply for XP come from subprojects, built
# here with these flags (WrapDB's for curl, the text stack, SQLite, zlib,
# Brotli, zstd and libpsl), and the C runtime is the system's msvcrt.dll.
# scripts/check-xp-imports.py then checks that weststar.exe imports nothing
# Windows XP SP3 lacks. See docs/building.md.

[built-in options]
c_args = ['-D_WIN32_WINNT=0x0501', '-DWINVER=0x0501']
cpp_args = ['-D_WIN32_WINNT=0x0501', '-DWINVER=0x0501']
# Static libgcc, libstdc++ (HarfBuzz) and winpthreads: no DLLs to ship.
# The PE header asks for Windows 5.1, XP, as the oldest system and
# subsystem that may load it.
c_link_args = ['-static',
               '-Wl,--major-os-version=5', '-Wl,--minor-os-version=1',
               '-Wl,--major-subsystem-version=5', '-Wl,--minor-subsystem-version=1']
cpp_link_args = ['-static',
                 '-Wl,--major-os-version=5', '-Wl,--minor-os-version=1',
                 '-Wl,--major-subsystem-version=5', '-Wl,--minor-subsystem-version=1']
default_library = 'static'
# MINGW32's own packages are built for Windows 7 and later: every
# library comes from its subproject instead.
force_fallback_for = ['sdl2', 'libcurl', 'mbedtls', 'mbedcrypto',
                      'freetype2', 'harfbuzz', 'fribidi', 'sqlite3', 'zlib',
                      'libpsl', 'libbrotlidec', 'libzstd']
# Not link-time optimised: it would make the 32-bit build slow, and the
# XP build is about where the browser runs rather than how fast.
b_lto = false

[project options]
sdl = 'sdl2'
crypto = 'mbedtls'
fontconfig = 'disabled'
avif = 'disabled'
# MINGW32's Enchant, if installed, is built for Windows 7.
spellcheck = 'disabled'
wasm = 'disabled'

[curl:project options]
tool = 'disabled'
tests = 'disabled'
unittests = 'disabled'
ssl = 'enabled'
mbedtls = 'enabled'
openssl = 'disabled'
schannel = 'disabled'
ssl-default-backend = 'mbedtls'
ca_bundle = ''
ca_path = ''
# The browser speaks HTTP/1.1 here; WinIDN (normaliz.dll), LDAP and the
# others are not wanted or not on XP.
http2 = 'disabled'
idn = 'disabled'
ldap = 'disabled'
ldaps = 'disabled'
ssh = 'disabled'
# The browser keeps its cookies in curl's cookie engine, which refuses a
# Set-Cookie for a public suffix through libpsl. (The browser's own checks
# use the list compiled into it, src/psl.c.)
psl = 'enabled'
libz = 'enabled'
brotli = 'enabled'
zstd = 'enabled'
asynchdns-resolver = ['win32']
# What the browser asks of curl is HTTP and HTTPS, WebSocket (src/ws.c),
# FTP (ftp:// files and listings), cookies, HSTS, Alt-Svc, DNS over HTTPS,
# proxies, and Basic authentication from a URL's user name and password.
# The other protocols, authentication schemes (NTLM, Kerberos and
# Negotiate through SSPI, Digest, AWS, bearer tokens) and APIs (MIME
# forms, .netrc, the option and header lookups) are left out. (Binding to
# a local interface stays: curl 8.12's FTP needs its code.)
file = 'disabled'
dict = 'disabled'
gopher = 'disabled'
imap = 'disabled'
ipfs = 'disabled'
mqtt = 'disabled'
pop3 = 'disabled'
rtmp = 'disabled'
rtsp = 'disabled'
smb = 'disabled'
smtp = 'disabled'
telnet = 'disabled'
tftp = 'disabled'
aws = 'disabled'
bearer-auth = 'disabled'
digest-auth = 'disabled'
kerberos-auth = 'disabled'
negotiate-auth = 'disabled'
ntlm = 'disabled'
gss-api = 'disabled'
sspi = 'disabled'
tls-srp = 'disabled'
sha512_256 = 'disabled'
mime = 'disabled'
form-api = 'disabled'
netrc = 'disabled'
getoptions = 'disabled'
headers-api = 'disabled'
unixsockets = 'disabled'
libcurl-option = 'disabled'
progress-meter = 'disabled'

[libpsl:project options]
runtime = 'no'
tests = false

[freetype2:project options]
png = 'disabled'
bzip2 = 'disabled'
harfbuzz = 'disabled'
brotli = 'disabled'

[harfbuzz:project options]
tests = 'disabled'
docs = 'disabled'
utilities = 'disabled'
glib = 'disabled'
gobject = 'disabled'
cairo = 'disabled'
freetype = 'enabled'
icu = 'disabled'
introspection = 'disabled'

[zstd:project options]
bin_programs = false
multi_thread = 'disabled'

[fribidi:project options]
bin = false
tests = false
docs = false

# Third-party code keeps its own warnings: a --werror build of the browser
# (as in CI) holds only the browser's code to none.
[curl:built-in options]
werror = false
[freetype2:built-in options]
werror = false
[harfbuzz:built-in options]
werror = false
[fribidi:built-in options]
werror = false
[sqlite3:built-in options]
werror = false
[zlib:built-in options]
werror = false
[libpsl:built-in options]
werror = false
[google-brotli:built-in options]
werror = false
[zstd:built-in options]
werror = false
